name: Deep Learning Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-and-static-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linting Tools
        run: |
          sudo apt update --yes
          sudo apt install --yes clang-format cppcheck

      - name: Run clang-format
        run: |
          find . \( -name "*.cpp" -o -name "*.hpp" -o -name "*.cu" -o -name "*.cuh" -o -name "*.cc" \) \
          -not -path "*/build/*" -not -path "*/extern/*" | xargs clang-format -style=file --dry-run --Werror

      - name: Run Cppcheck
        run: |
          cppcheck --enable=all --suppress=unusedFunction --error-exitcode=1 \
          -I include src/

  build-and-test:
    needs: format-and-static-check
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler_ver: [14, 15]
        build_type: [Debug, Release]
    
    container: gcc:${{ matrix.compiler_ver }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          apt update --yes
          apt install --yes cmake clang-tidy

      - name: Configure and Build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_SANITIZERS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
            -DPRODUCTION=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
          cmake --build build -j $(nproc)

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Run Benchmarks (Only Release)
        if: matrix.build_type == 'Release'
        run: |
          ./build/benchmarks/bench_tensor --benchmark_min_time=0.01 || true